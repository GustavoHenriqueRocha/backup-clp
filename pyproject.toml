[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backup-clp"
version = "0.1.0"
description = "Versionamento automático dos programas de CLP e IHM: vigia pastas e IHMs, guarda cada versão com data, hash e autor, e mostra o que mudou"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gustavo Henrique Rocha" }]
keywords = ["clp", "plc", "ihm", "hmi", "backup", "versionamento", "industria", "automacao", "ftp"]

[project.scripts]
backup-clp = "backup_clp.__main__:main"

[tool.setuptools]
packages = ["backup_clp"]

[tool.setuptools.package-data]
backup_clp = ["pagina.html"]
