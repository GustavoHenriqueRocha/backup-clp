<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{titulo}}</title>
<style>
:root {
  --fundo:#0a0f1c; --cartao:#121a2e; --cartao2:#18223b; --borda:#22304f; --texto:#e8edf7; --suave:#8597ba; --fraco:#55678c;
  --ok:#39d98a; --aviso:#f2b84b; --ruim:#ff6b6b; --azul:#5aa9ff; --roxo:#a78bfa;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:radial-gradient(1200px 600px at 50% -200px, #16213d 0%, var(--fundo) 60%) fixed, var(--fundo);
  color:var(--texto); font-family:system-ui, "Segoe UI", Roboto, sans-serif; padding:22px 16px 40px; min-height:100vh; }
.topo { max-width:1240px; margin:0 auto 18px; display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 24px; }
.topo h1 { font-size:22px; font-weight:650; }
.topo .sub { color:var(--suave); font-size:13px; margin-top:3px; }
.topo .resumo { margin-left:auto; display:flex; gap:22px; }
.kpi { text-align:right; }
.kpi b { display:block; font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; }
.kpi span { color:var(--suave); font-size:11px; text-transform:uppercase; letter-spacing:.08em; }
.layout { max-width:1240px; margin:0 auto; display:grid; grid-template-columns:260px 1fr; gap:16px; align-items:start; }
@media (max-width:820px) { .layout { grid-template-columns:1fr; } .topo .resumo { margin-left:0; } }
.cartao { background:linear-gradient(180deg, var(--cartao2), var(--cartao)); border:1px solid var(--borda); border-radius:16px; padding:14px 16px; }
.maqs h2, .cab h2 { font-size:12px; color:var(--suave); text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin-bottom:10px; }
.maq { display:block; width:100%; text-align:left; background:none; border:1px solid transparent; color:var(--texto); border-radius:10px;
  padding:10px 12px; cursor:pointer; font:inherit; margin-bottom:4px; }
.maq:hover { background:rgba(90,169,255,.06); }
.maq.ativa { background:rgba(90,169,255,.12); border-color:rgba(90,169,255,.35); }
.maq b { font-size:15px; font-weight:600; display:block; }
.maq small { color:var(--suave); font-size:12px; }
.maq .erro { color:var(--ruim); }
.cab { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:12px; }
.cab h2 { margin:0; }
.cab select { margin-left:auto; background:var(--fundo); color:var(--texto); border:1px solid var(--borda); border-radius:8px; padding:6px 8px; font:inherit; font-size:13px; max-width:100%; }
.barra { display:flex; flex-wrap:wrap; align-items:center; gap:10px; font-size:13px; color:var(--suave); padding:10px 12px; border:1px dashed var(--borda); border-radius:10px; margin-bottom:12px; }
.barra b { color:var(--texto); }
.btn { background:#2b5fd9; color:#fff; border:0; border-radius:8px; padding:7px 12px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; text-decoration:none; }
.btn:disabled { opacity:.35; cursor:default; }
.btn.leve { background:var(--cartao2); color:var(--texto); border:1px solid var(--borda); font-weight:500; padding:5px 10px; font-size:12px; }
.linha { position:relative; padding-left:22px; }
.linha::before { content:""; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--borda); }
.v { position:relative; display:grid; grid-template-columns:auto 1fr auto; gap:4px 12px; align-items:center; padding:10px 12px; border-radius:12px; border:1px solid transparent; margin-bottom:6px; }
.v::before { content:""; position:absolute; left:-21px; top:16px; width:12px; height:12px; border-radius:50%; background:var(--fundo); border:2px solid var(--azul); }
.v.sel { border-color:rgba(167,139,250,.5); background:rgba(167,139,250,.07); }
.v:hover { background:rgba(255,255,255,.025); }
.v input { width:16px; height:16px; accent-color:var(--roxo); }
.v .arq { font-weight:600; font-size:14px; overflow-wrap:anywhere; }
.v .meta { grid-column:2 / 4; color:var(--suave); font-size:12px; display:flex; flex-wrap:wrap; gap:4px 14px; }
.v .meta code { color:var(--fraco); }
.v .acoes { display:flex; gap:6px; }
.tag { font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; background:rgba(90,169,255,.14); color:var(--azul); margin-left:6px; }
.vazio { color:var(--suave); font-size:14px; padding:30px 10px; text-align:center; }
#diff { margin-top:16px; display:none; }
#diff .titulo { font-size:14px; margin-bottom:10px; }
#diff .titulo span { color:var(--suave); }
.resumo-diff { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
.chip { font-size:12px; padding:3px 10px; border-radius:99px; background:var(--cartao2); border:1px solid var(--borda); color:var(--suave); }
.chip.mais { color:var(--ok); border-color:rgba(57,217,138,.35); }
.chip.menos { color:var(--ruim); border-color:rgba(255,107,107,.35); }
pre.cod { background:#070b15; border:1px solid var(--borda); border-radius:10px; padding:10px 0; overflow:auto; font:12.5px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; max-height:560px; }
pre.cod span { display:block; padding:0 12px; white-space:pre; }
pre.cod .a { background:rgba(57,217,138,.11); color:#9ff0c6; }
pre.cod .r { background:rgba(255,107,107,.11); color:#ffb4b4; }
pre.cod .h { color:var(--azul); }
pre.cod .f { color:var(--fraco); }
.entrada { border-top:1px solid var(--borda); padding-top:10px; margin-top:10px; }
.entrada h3 { font-size:13px; font-weight:600; margin-bottom:8px; overflow-wrap:anywhere; }
table.reg { border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums; }
table.reg td, table.reg th { padding:4px 14px 4px 0; text-align:left; }
table.reg th { color:var(--suave); font-weight:500; }
</style>
</head>
<body>
<header class="topo">
  <div><h1>{{titulo}}</h1><div class="sub">Versões dos programas de CLP e IHM, com data, hash e origem</div></div>
  <div class="resumo">
    <div class="kpi"><b id="k-maq">–</b><span>máquinas</span></div>
    <div class="kpi"><b id="k-arq">–</b><span>arquivos</span></div>
    <div class="kpi"><b id="k-ver">–</b><span>versões</span></div>
  </div>
</header>
<div class="layout">
  <nav class="cartao maqs"><h2>Máquinas</h2><div id="maqs"></div></nav>
  <main>
    <section class="cartao">
      <div class="cab"><h2 id="t-maq">Linha do tempo</h2><select id="filtro"><option value="">todos os arquivos</option></select></div>
      <div class="barra"><span>Comparar: <b id="sel-a">marque duas versões</b></span><button class="btn" id="comparar" disabled>Comparar</button></div>
      <div class="linha" id="linha"></div>
    </section>
    <section class="cartao" id="diff"></section>
  </main>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tam = n => n < 1024 ? n + " B" : n < 1048576 ? (n/1024).toFixed(1).replace(".", ",") + " KiB" : (n/1048576).toFixed(1).replace(".", ",") + " MiB";
const data = s => { if (!s) return "–"; const d = new Date(s); return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}); };
let maquina = null, versoes = [], selecionadas = [];

async function api(u) { const r = await fetch(u); if (!r.ok) throw new Error((await r.json()).erro || r.status); return r.json(); }

async function carregarMaquinas() {
  const d = await api("/api/maquinas");
  $("#k-maq").textContent = d.maquinas.length;
  $("#k-arq").textContent = d.maquinas.reduce((s, m) => s + m.arquivos, 0);
  $("#k-ver").textContent = d.maquinas.reduce((s, m) => s + m.versoes, 0);
  const erros = (d.estado && d.estado.erros) || {};
  $("#maqs").innerHTML = d.maquinas.map(m => `<button class="maq${m.maquina === maquina ? " ativa" : ""}" data-m="${esc(m.maquina)}">
    <b>${esc(m.maquina)}</b><small>${m.versoes} versões · ${m.arquivos} arquivo(s)<br>última ${data(m.ultima)}</small>
    ${erros[m.maquina] ? `<small class="erro"><br>${esc(erros[m.maquina])}</small>` : ""}</button>`).join("")
    || `<div class="vazio">Nenhuma versão ainda.</div>`;
  document.querySelectorAll(".maq").forEach(b => b.onclick = () => escolher(b.dataset.m));
  if (!maquina && d.maquinas.length) {
    // Link direto: ?maquina=Injetora 2&comparar=3,6
    const q = new URLSearchParams(location.search);
    const pedida = d.maquinas.find(m => m.maquina === q.get("maquina"));
    await escolher((pedida || d.maquinas[0]).maquina);
    const par = (q.get("comparar") || "").split(",").map(Number).filter(Boolean);
    if (pedida && par.length === 2) { selecionadas = par; desenhar(); mostrarDiff(par[0], par[1], false); }
  }
}

async function escolher(m) {
  maquina = m; selecionadas = [];
  document.querySelectorAll(".maq").forEach(b => b.classList.toggle("ativa", b.dataset.m === m));
  $("#t-maq").textContent = "Linha do tempo · " + m;
  versoes = await api("/api/versoes?maquina=" + encodeURIComponent(m));
  const arquivos = [...new Set(versoes.map(v => v.arquivo))].sort();
  $("#filtro").innerHTML = `<option value="">todos os arquivos (${arquivos.length})</option>` + arquivos.map(a => `<option>${esc(a)}</option>`).join("");
  $("#diff").style.display = "none";
  desenhar();
}

function desenhar() {
  const f = $("#filtro").value;
  const lista = versoes.filter(v => !f || v.arquivo === f);
  const maisNova = {};
  for (const v of versoes) if (!(v.arquivo in maisNova)) maisNova[v.arquivo] = v.id;
  const anterior = {};
  for (let i = versoes.length - 1; i >= 0; i--) { const v = versoes[i]; v._ant = anterior[v.arquivo]; anterior[v.arquivo] = v.id; }
  $("#linha").innerHTML = lista.map(v => `<div class="v${selecionadas.includes(v.id) ? " sel" : ""}">
    <input type="checkbox" data-id="${v.id}" ${selecionadas.includes(v.id) ? "checked" : ""} title="selecionar para comparar">
    <div class="arq">${esc(v.arquivo)}${maisNova[v.arquivo] === v.id ? '<span class="tag">atual</span>' : ""}</div>
    <div class="acoes">${v._ant ? `<button class="btn leve" data-ant="${v._ant}" data-id="${v.id}">vs. anterior</button>` : ""}
      <a class="btn leve" href="/baixar/${v.id}">baixar</a></div>
    <div class="meta"><span>#${v.id}</span><span>${data(v.capturado)}</span><span>${tam(v.tamanho)}</span>
      <span>${esc(v.autor || "autor ?")}</span><span title="${esc(v.origem)}">${esc(v.origem.length > 48 ? "…" + v.origem.slice(-47) : v.origem)}</span>
      <code title="${v.hash}">${v.hash.slice(0, 12)}</code></div></div>`).join("") || `<div class="vazio">Sem versões.</div>`;
  document.querySelectorAll("#linha input").forEach(c => c.onchange = () => marcar(+c.dataset.id, c.checked));
  document.querySelectorAll("#linha [data-ant]").forEach(b => b.onclick = () => mostrarDiff(+b.dataset.ant, +b.dataset.id));
  const [a, b] = [...selecionadas].sort((x, y) => x - y);
  $("#sel-a").textContent = selecionadas.length === 2 ? `#${a} × #${b}` : selecionadas.length === 1 ? `#${selecionadas[0]} × ?` : "marque duas versões";
  $("#comparar").disabled = selecionadas.length !== 2;
}

function marcar(id, sim) {
  selecionadas = selecionadas.filter(x => x !== id);
  if (sim) { selecionadas.push(id); if (selecionadas.length > 2) selecionadas.shift(); }
  desenhar();
}

function linhasDiff(linhas) {
  return `<pre class="cod">${linhas.map(l => {
    const c = l.startsWith("+++") || l.startsWith("---") ? "f" : l.startsWith("@@") ? "h" : l[0] === "+" ? "a" : l[0] === "-" ? "r" : "";
    return `<span class="${c}">${esc(l) || " "}</span>`; }).join("")}</pre>`;
}

function corpo(r) {
  if (r.tipo === "igual") return `<div class="resumo-diff"><span class="chip">conteúdo idêntico</span></div>`;
  if (r.tipo === "texto") return `<div class="resumo-diff"><span class="chip">texto</span><span class="chip mais">+${r.adicionadas} linhas</span>
    <span class="chip menos">−${r.removidas} linhas</span>${r.cortado ? '<span class="chip">cortado</span>' : ""}</div>` + linhasDiff(r.linhas);
  if (r.tipo === "binario") return `<div class="resumo-diff"><span class="chip">binário</span><span class="chip">${tam(r.tamanho_a)} → ${tam(r.tamanho_b)}</span>
    <span class="chip menos">${r.bytes_alterados} byte(s) em ${r.regioes_total} região(ões)</span></div>
    <table class="reg"><tr><th>início</th><th>fim</th><th>bytes</th></tr>${r.regioes.map(g => `<tr><td>0x${g.inicio.toString(16).padStart(8, "0")}</td>
    <td>0x${g.fim.toString(16).padStart(8, "0")}</td><td>${g.fim - g.inicio}</td></tr>`).join("")}</table>
    ${r.regioes_total > r.regioes.length ? `<p class="chip">… mais ${r.regioes_total - r.regioes.length}</p>` : ""}`;
  if (r.tipo === "zip") return `<div class="resumo-diff"><span class="chip">zip</span><span class="chip mais">${r.adicionadas.length} adicionada(s)</span>
    <span class="chip menos">${r.removidas.length} removida(s)</span><span class="chip">${r.alteradas.length} alterada(s)</span><span class="chip">${r.iguais} igual(is)</span></div>
    ${r.adicionadas.map(n => `<div class="entrada"><h3 style="color:var(--ok)">+ ${esc(n)}</h3></div>`).join("")}
    ${r.removidas.map(n => `<div class="entrada"><h3 style="color:var(--ruim)">− ${esc(n)}</h3></div>`).join("")}
    ${r.alteradas.map(e => `<div class="entrada"><h3>~ ${esc(e.nome)}</h3>${corpo(e)}</div>`).join("")}`;
  return "";
}

async function mostrarDiff(a, b, rolar = true) {
  const box = $("#diff");
  box.style.display = "block";
  box.innerHTML = `<div class="vazio">comparando…</div>`;
  try {
    const r = await api(`/api/diff?a=${a}&b=${b}`);
    const nomeA = r.a.arquivo === r.b.arquivo ? "" : " " + esc(r.a.arquivo);
    box.innerHTML = `<div class="titulo"><b>#${r.a.id}</b>${nomeA} <span>(${data(r.a.capturado)})</span> → <b>#${r.b.id}</b> ${esc(r.b.arquivo)}
      <span>(${data(r.b.capturado)})</span></div>` + corpo(r);
  } catch (e) { box.innerHTML = `<div class="vazio">erro: ${esc(e.message)}</div>`; }
  if (rolar) box.scrollIntoView({behavior: "smooth", block: "start"});
}

$("#filtro").onchange = desenhar;
$("#comparar").onclick = () => { const [a, b] = [...selecionadas].sort((x, y) => x - y); mostrarDiff(a, b); };
carregarMaquinas().catch(e => $("#maqs").innerHTML = `<div class="vazio">erro: ${esc(e.message)}</div>`);
setInterval(() => carregarMaquinas().catch(() => {}), 30000);
</script>
</body>
</html>
